apply plugin: 'com.android.library'

android {
    compileSdkVersion 36

    defaultConfig {
        namespace "com.hippo.quickjs.android"
        minSdkVersion 23
        targetSdkVersion 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {/**/
            cmake {
                targets 'quickjs-android'
                arguments '-DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }

}


publishing {
    publications {
        release(MavenPublication) {
            groupId = "com.hippo.quickjs.android"
            artifactId = "quickjs-android"
            version = "1.0"

            afterEvaluate {
                from components.release
            }
        }

    }
}


dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'org.assertj:assertj-core:3.13.2'
}

